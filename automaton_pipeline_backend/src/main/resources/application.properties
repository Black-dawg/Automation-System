server.port=${PORT:8080}
spring.application.name=automation
spring.ai.openai.api-key=${OPENAI_API_KEY:demo_key_placeholder}
spring.ai.openai.chat.options.model=gpt-4o-mini

# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://placement-automation.czoiio8m2muf.ap-southeast-2.rds.amazonaws.com:5432/placement_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:0000}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Notion Integration Configuration
notion.api.token=${NOTION_API_TOKEN:}
notion.api.database.id=${NOTION_DATABASE_ID:}

# WhatsApp API Configuration
whatsapp.api.token=${WHATSAPP_API_TOKEN:}
whatsapp.api.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
